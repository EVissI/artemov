<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AA - Два мира</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .paper { fill:var(--paper); }
  .slab { fill:var(--ink); }
  .raised { fill:var(--surface-raised); }
  .bloom { fill:var(--bloom); }
  .siren { fill:var(--siren); }
  .tile { fill:var(--tile); rx:var(--radius-none); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:700; font-size:64px; line-height:.95; letter-spacing:-.01em; color:var(--ink); }

<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      paper 176×224 (wallpaper, Мир 1) · ink slab 256 wide bleeding top, bottom and right (void/ash - the ink of each world) · surface-raised 96×64 cut into the slab (a note / a poster plate) · bloom 48×24 once · siren disc r=8 once (it only ever means REC)
  arrangement two worlds side by side: the paper block on the left, the slab on the right with a torn left edge - the rift between them
  pattern     tiles, from "кафель госпиталя" and the square system: space-5 (24px) squares at a 24px pitch with a 2px seam, cut into the paper block, thinning toward the tear; three strays fall into the slab as surface-raised
  scales      sides in space-2/space-5 multiples; gutters space-4; tile pitch space-5; corners radius-none everywhere, the siren disc radius-round
-->
