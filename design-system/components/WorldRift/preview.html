<!-- @dsCard group="Секции" height=600 subtitle="Ползунок = прокрутка: обои рвутся, под ними ржавый металл" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>WorldRift - превью</title>
<style>html,body{margin:0}body{background:var(--surface);color:var(--ink);font-family:var(--font-sans)}#root{padding:24px}#root{padding:0}.aa-rift--static .aa-rift__stage{height:540px;min-height:0}input[type=range]{accent-color:var(--ash)}</style>
</head>
<body>
<div id="root"></div>
<script>
var A = window.AA, h = React.createElement;
function Demo() {
  var s = React.useState(0.35), p = s[0], set = s[1];
  var a = React.useState(false), play = a[0], setPlay = a[1];
  React.useEffect(function () { if (!play) return; var raf, st = performance.now(); var f = function (n) { var t = ((n - st) / 6000) % 1; set(t); raf = requestAnimationFrame(f); }; raf = requestAnimationFrame(f); return function () { cancelAnimationFrame(raf); }; }, [play]);
  return h('div', null,
    h('div', { className: 'aa-label', style: { display: 'flex', gap: 16, alignItems: 'center', padding: '10px 16px', background: 'var(--void)', color: 'var(--ash)' } },
      h('label', { htmlFor: 'p' }, 'Прогресс ' + Math.round(p * 100) + '%'),
      h('input', { id: 'p', type: 'range', min: 0, max: 1, step: 0.005, value: p, onChange: function (e) { setPlay(false); set(+e.target.value); }, style: { flex: 1 } }),
      h(A.Button, { variant: 'outline', onClick: function () { setPlay(!play); }, style: { minHeight: 36, color: 'var(--ash)', borderColor: 'var(--ash)' } }, play ? 'Пауза' : 'Прогнать')),
    h(A.WorldRift, { rift: {"title": ["Дальше -", "работы"], "topMeta": ["Мир 1 · Туман", "Сигнал слабеет"], "bottomMeta": ["Мир 2", "Канал 02 · Помехи"]}, progress: p }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
