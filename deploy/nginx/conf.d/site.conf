# HTTP: работает сразу после запуска. Когда появится сертификат - см. deploy/README.md (site-https.conf.example).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # проверка домена для Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    include /etc/nginx/conf.d/proxy.inc;
}
