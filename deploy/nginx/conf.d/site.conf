# HTTPS для temak1n-portfolio.xyz (каноничный домен, без www). Без сертификата nginx с ним не стартует -
# на новом сервере сначала site-http.conf.example (см. deploy/README.md). Для другого домена - заменить temak1n-portfolio.xyz везде.
# http://(www.)домен и https://www.домен -> 301 на https://temak1n-portfolio.xyz
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # проверка домена для Let's Encrypt (продление)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://temak1n-portfolio.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.temak1n-portfolio.xyz;

    ssl_certificate     /etc/letsencrypt/live/temak1n-portfolio.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temak1n-portfolio.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://temak1n-portfolio.xyz$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name temak1n-portfolio.xyz;

    ssl_certificate     /etc/letsencrypt/live/temak1n-portfolio.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temak1n-portfolio.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/proxy.inc;
}
